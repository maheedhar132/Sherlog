name: Bug report
description: Something is broken or wrong in the game
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: incident
    attributes:
      label: Incident number
      description: The INC-xxxxx or DAILY #n shown in the match header. It reproduces the exact incident.
      placeholder: INC-51946
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Easy, Normal, Hard, Daily]
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on macOS, Safari on iPhone
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console errors
