name: Feature request
description: Suggest an idea for Sherlog
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the player or learner problem first, then your idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: It works without a server, account or API key
        - label: I'm willing to open a PR for this
